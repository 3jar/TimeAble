[project]
name = "timeable"
version = "0.1.0"
description = "TimeAble - 등록한 학생들의 공통 빈 시간을 복셀 지형도로 보여주는 서비스"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timeable"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
